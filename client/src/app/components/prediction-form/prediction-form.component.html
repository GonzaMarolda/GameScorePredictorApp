<div class="prediction-form-container">
    <div class="row">
        <label>Title
            <input type="text" [value]="title()" (input)="setTitle($event)" />
        </label>
    </div>

    <div class="row">
        <label>Price (USD)
            <input type="number" [value]="price()" (input)="setPrice($event)" />
        </label>

        <label>Release Year
            <input type="number" [value]="releaseYear()" (input)="setReleaseYear($event)" />
        </label>

        <label>Required Age
            <input type="number" [value]="requiredAge()" (input)="setRequiredAge($event)" />
        </label>
    </div>

    <div class="row">
        <label><input type="checkbox" [checked]="isIndie()" (change)="setIsIndie($event)" /> Is Indie?</label>
        <label><input type="checkbox" [checked]="supportsEnglish()" (change)="setSupportsEnglish($event)" /> Supports English?</label>

        <label>Supported languages amount
            <input type="number" [value]="supportedLanguagesAmount()" (input)="setSupportedLanguagesAmount($event)" />
        </label>
    </div>

    <div class="selector-container">
        <label>Tags
            <app-dropdown
                [availableOptions]="availableTags()"
                (optionsOutput)="handleTagsOutput($event)"
            ></app-dropdown>
        </label>
    </div>

    <div class="selector-container">
        <label>Publishers
            <app-dropdown
                [availableOptions]="availablePublishers()"
                (optionsOutput)="handlePublishersOutput($event)"
            ></app-dropdown>
        </label>
    </div>

    <div class="submit-container">
        <button type="button" (click)="submit()">Predict</button>
    </div>
</div>
